<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal Boss Standalone</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e5e7eb;font-family:system-ui,sans-serif;padding:16px}
h1{font-size:28px;margin:6px 0}h1 span{color:#fbbf24}.badge{display:inline-block;background:#064e3b;color:#a7f3d0;padding:6px 10px;border-radius:999px;font-size:13px}
.warn{background:#1c2a15;border:1px solid #fbbf24;padding:12px;border-radius:12px;line-height:1.6}
.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tabs button{white-space:nowrap;padding:10px 14px;border-radius:999px;border:1px solid #334155;background:#111c33;color:#fff;cursor:pointer}.tabs button.on{background:#f59e0b;color:#111;font-weight:700}
.card{background:#111c33;border:1px solid #263554;border-radius:16px;padding:16px;margin-bottom:12px}
label{font-size:13px;color:#94a3b8;display:block;margin:10px 0 4px}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0b1220;color:#fff;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{background:#f59e0b;color:#111;border:0;padding:14px;border-radius:12px;font-weight:800;width:100%;font-size:16px;cursor:pointer;margin-top:12px}
.result{font-size:22px;font-weight:800;padding:14px;border-radius:12px;text-align:center;margin-top:12px}.LONG{background:#065f46}.SHORT{background:#7f1d1d}.WAIT{background:#334155}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #263554;padding:8px;text-align:left}
canvas{width:100%;background:#020617;border-radius:12px}small{color:#94a3b8;line-height:1.6}
</style></head><body>
<h1>SIGNAL BOSS <span>Standalone</span></h1><div class="badge">✓ คำนวณในเครื่อง • ไม่ต่อ Vercel API • ไม่ต่อเน็ต • ไม่มี Auto Trade</div>
<div class="warn" style="margin-top:12px"><b>ราคาที่คุณกรอกเอง</b> — แอปนี้ไม่มีราคาอัตโนมัติ ไม่มีดึงข้อมูลจากเน็ต ทุกตัวเลขมาจากที่คุณพิมพ์/วางเท่านั้น ตรวจสอบก่อนเทรดเสมอ</div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
<script>
const T=[['signal','📶 สัญญาณ'],['ohlc','📊 วาง OHLC'],['mtf','🗂️ MTF'],['alert','🔔 แจ้งเตือน'],['back','🧮 Backtest'],['journal','📓 สมุดเทรด']];
const tabs=document.getElementById('tabs'), view=document.getElementById('view'); let cur='signal';
function renderTabs(){tabs.innerHTML=T.map(x=>`<button class="${x[0]===cur?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(t){cur=t;renderTabs();show()}
function num(id){return parseFloat(document.getElementById(id).value)||0}
function calcSignal(){
 const sym=document.getElementById('sym').value||'BTCUSDT', p=num('price'), o=num('open'), h=num('high'), l=num('low'), c=num('close'), rsi=num('rsi');
 let score=50, why=[];
 if(c>o){score+=12;why.push('แท่งเขียว +12')} else if(c<o){score-=12;why.push('แท่งแดง -12')}
 const range=h-l||1, lower=c-l, upper=h-c;
 if(lower>upper){score+=10;why.push('ไส้ล่างยาว แรงซื้อดัน +10')} else if(upper>lower){score-=8;why.push('ไส้บนยาว แรงขายกด -8')}
 if(rsi){ if(rsi<30){score+=12;why.push('RSI<30 Oversold +12')} else if(rsi>70){score-=12;why.push('RSI>70 Overbought -12')} else if(rsi>=50){score+=5;why.push('RSI>=50 +5')} }
 let sig='WAIT', cls='WAIT';
 if(score>=65){sig='LONG';cls='LONG'} else if(score<=35){sig='SHORT';cls='SHORT'}
 let entry=p, sl, tp1, tp2;
 if(sig==='LONG'){sl=l- (range*0.1); tp1=h; tp2=h+range*0.5}
 else if(sig==='SHORT'){sl=h+(range*0.1); tp1=l; tp2=l-range*0.5}
 else {sl=l; tp1=h; tp2=h+range*0.3}
 const risk=Math.abs(entry-sl)||1, rew=Math.abs(tp2-entry)||0;
 document.getElementById('out').innerHTML=`<div class="result ${cls}">${sig} • Score ${score}/100 • ${sym}</div>
 <table><tr><td>Entry</td><td>${entry.toLocaleString()}</td></tr><tr><td>SL</td><td>${sl.toLocaleString()}</td></tr><tr><td>TP1 (High/Low)</td><td>${tp1.toLocaleString()}</td></tr><tr><td>TP2</td><td>${tp2.toLocaleString()}</td></tr><tr><td>Support</td><td>${l.toLocaleString()}</td></tr><tr><td>Resistance</td><td>${h.toLocaleString()}</td></tr><tr><td>Risk : Reward</td><td>1 : ${(rew/risk).toFixed(2)}</td></tr></table><small>${why.join(' • ')}<br>${sig==='WAIT'?'ราคา อยู่กลางทาง / ได้ไม่คุ้มเสีย — รอย่อใกล้ Support หรือทะลุ Resistance ก่อน':'ต้องตั้ง SL ก่อนเข้าเสมอ เสี่ยงไม้ละไม่เกิน 0.5-1% ของพอร์ต'}</small>`;
 drawCandle(o,h,l,c);
}
function drawCandle(o,h,l,c){
 const cv=document.getElementById('cv'); if(!cv) return; const ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height);
 const mn=Math.min(o,h,l,c), mx=Math.max(o,h,l,c), pad=20, y=v=>pad+(mx-v)/(mx-mn||1)*(cv.height-pad*2);
 ctx.strokeStyle='#94a3b8'; ctx.beginPath(); ctx.moveTo(150,y(h)); ctx.lineTo(150,y(l)); ctx.stroke();
 ctx.fillStyle=c>=o?'#22c55e':'#ef4444'; ctx.fillRect(100, y(Math.max(o,c)), 100, Math.max(4,Math.abs(y(o)-y(c))));
 ctx.fillStyle='#fbbf24'; ctx.fillRect(0,y(h),300,2); ctx.fillRect(0,y(l),300,2);
 ctx.fillStyle='#fff'; ctx.font='12px sans-serif'; ctx.fillText('R '+h.toLocaleString(),210,y(h)); ctx.fillText('S '+l.toLocaleString(),210,y(l));
}
function show(){
 if(cur==='signal') view.innerHTML=`<div class="card"><h2>1 • สัญญาณ</h2><small>กรอกตัวเลขเองทั้งหมด แล้วกดคำนวณ</small>
 <div class="grid"><div><label>Symbol</label><input id="sym" value="BTCUSDT"></div><div><label>ราคาปัจจุบัน *</label><input id="price" type="number" value="97500"></div>
 <div><label>Open แท่งล่าสุด</label><input id="open" type="number" value="97000"></div><div><label>High แท่งล่าสุด</label><input id="high" type="number" value="98200"></div>
 <div><label>Low แท่งล่าสุด</label><input id="low" type="number" value="96400"></div><div><label>Close แท่งล่าสุด</label><input id="close" type="number" value="97500"></div>
 <div><label>RSI (ถ้ามี)</label><input id="rsi" type="number" placeholder="เช่น 52"></div><div><label>หมายเหตุ</label><input value="ดูในแอป Binance แล้วกรอก" readonly></div></div>
 <button class="btn" onclick="calcSignal()">คำนวณสัญญาณ</button><div id="out"></div><canvas id="cv" width="300" height="200" style="margin-top:10px"></canvas></div>`;
 else if(cur==='ohlc') view.innerHTML=`<div class="card"><h2>วาง OHLC</h2><small>วางทีละบรรทัด: open,high,low,close เช่น 97000,98200,96400,97500</small><textarea id="ohlc" rows="6">97000,98200,96400,97500
97500,98800,97200,98400
98400,99200,97800,98000</textarea><button class="btn" onclick="calcOHLC()">วาดกราฟ + หา S/R</button><div id="out2"></div><canvas id="cv2" width="300" height="200" style="margin-top:10px"></canvas></div>`;
 else if(cur==='mtf') view.innerHTML=`<div class="card"><h2>MTF 15m / 1h / 4h</h2>
 ${['15m','1h','4h'].map(t=>`<label>เทรนด์ ${t}</label><select id="mtf-${t}"><option value="up">ขึ้น</option><option value="down">ลง</option><option value="side" selected>ไซด์เวย์</option></select>`).join('')}
 <button class="btn" onclick="calcMTF()">เช็คความสอดคล้อง</button><div id="out3"></div></div>`;
 else if(cur==='alert') view.innerHTML=`<div class="card"><h2>แจ้งเตือนราคา</h2><label>ราคาปัจจุบัน (กรอกเอง)</label><input id="ap" type="number" value="97500"><label>ราคาเป้าหมาย</label><input id="at" type="number" value="96500"><label>เงื่อนไข</label><select id="ac"><option value="down">ลงถึง</option><option value="up">ขึ้นถึง</option></select><button class="btn" onclick="checkAlert()">เช็คตอนนี้</button><div id="out4"></div><small>แอปนี้ไม่มีแจ้งเตือนพื้นหลัง — ต้องเปิดหน้านี้แล้วกดเช็คเอง</small></div>`;
 else if(cur==='back') view.innerHTML=`<div class="card"><h2>Backtest ง่ายๆ</h2><div class="grid"><div><label>จำนวนเทรดทั้งหมด</label><input id="bn" type="number" value="30"></div><div><label>ชนะ</label><input id="bw" type="number" value="18"></div></div><button class="btn" onclick="calcBack()">คำนวณ WinRate + Wilson</button><div id="out5"></div></div>`;
 else if(cur==='journal') view.innerHTML=`<div class="card"><h2>สมุดเทรด</h2><label>บันทึก เช่น BTCUSDT LONG Entry 97500 SL 96400 TP 98200 ผล +700</label><input id="j" placeholder="พิมพ์แล้วกดบันทึก"><button class="btn" onclick="saveJ()">บันทึก</button><div id="out6"></div></div><div class="card"><div id="jlist"></div></div>`; if(cur==='journal') listJ();
}
function calcOHLC(){
 const lines=document.getElementById('ohlc').value.trim().split('\n').map(l=>l.split(',').map(Number)).filter(r=>r.length>=4);
 if(!lines.length) return; const highs=lines.map(r=>r[1]), lows=lines.map(r=>r[2]);
 const R=Math.max(...highs), S=Math.min(...lows);
 document.getElementById('out2').innerHTML=`<table><tr><td>แท่งทั้งหมด</td><td>${lines.length}</td></tr><tr><td>Resistance (High สูงสุด)</td><td>${R.toLocaleString()}</td></tr><tr><td>Support (Low ต่ำสุด)</td><td>${S.toLocaleString()}</td></tr></table>`;
 const cv=document.getElementById('cv2'), ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height);
 const mn=Math.min(...lows), mx=Math.max(...highs), y=v=>20+(mx-v)/(mx-mn||1)*160;
 lines.forEach((r,i)=>{const x=20+i*80; ctx.strokeStyle='#94a3b8'; ctx.beginPath(); ctx.moveTo(x+15,y(r[1])); ctx.lineTo(x+15,y(r[2])); ctx.stroke(); ctx.fillStyle=r[3]>=r[0]?'#22c55e':'#ef4444'; ctx.fillRect(x,y(Math.max(r[0],r[3])),30,Math.max(4,Math.abs(y(r[0])-y(r[3]))));});
}
function calcMTF(){
 const v=['15m','1h','4h'].map(t=>document.getElementById('mtf-'+t).value);
 const up=v.filter(x=>x==='up').length, down=v.filter(x=>x==='down').length;
 let txt = up===3 ? '🟢 3/3 ขึ้นตรงกัน — LONG ได้เปรียบ' : down===3 ? '🔴 3/3 ลงตรงกัน — SHORT ได้เปรียบ' : up>=2 ? '🟡 2/3 ขึ้น — LONG แบบระวัง' : down>=2 ? '🟡 2/3 ลง — SHORT แบบระวัง' : '⚪ ขัดกัน — WAIT รอ';
 document.getElementById('out3').innerHTML=`<div class="result WAIT">${txt}</div><small>15m: ${v[0]} • 1h: ${v[1]} • 4h: ${v[2]}</small>`;
}
function checkAlert(){
 const p=num('ap'), t=num('at'), c=document.getElementById('ac').value;
 const hit = c==='down' ? p<=t : p>=t;
 document.getElementById('out4').innerHTML=`<div class="result ${hit?'LONG':'WAIT'}">${hit?'🔔 ถึงเป้าแล้ว! ราคา '+p.toLocaleString()+' ถึง '+t.toLocaleString():'ยังไม่ถึงเป้า — ปัจจุบัน '+p.toLocaleString()+' เป้า '+t.toLocaleString()}</div>`;
 if(hit){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); const o=a.createOscillator(); o.connect(a.destination); o.start(); setTimeout(()=>o.stop(),500);}catch(e){} }
}
function calcBack(){
 const n=num('bn'), w=num('bw'); if(!n) return;
 const wr=w/n*100; const z=1.96; const ph=w/n; const denom=1+z*z/n; const centre=(ph+z*z/(2*n))/denom; const margin=z*Math.sqrt((ph*(1-ph)/n+z*z/(4*n*n)))/denom; const wilson=(centre-margin)*100;
 document.getElementById('out5').innerHTML=`<table><tr><td>WinRate</td><td>${wr.toFixed(1)}%</td></tr><tr><td>Wilson Lower Bound</td><td>${wilson.toFixed(1)}%</td></tr><tr><td>สถานะ</td><td>${n>=30?'✅ ใช้ได้ (ครบ 30 ไม้)':'⚠️ Low Sample — ยังน้อยไป อย่าเพิ่งเชื่อ'}</td></tr></table>`;
}
function saveJ(){
 const v=document.getElementById('j').value.trim(); if(!v) return; const arr=JSON.parse(localStorage.getItem('sb_j')||'[]'); arr.push(v); localStorage.setItem('sb_j',JSON.stringify(arr)); document.getElementById('j').value=''; listJ();
}
function listJ(){
 const arr=JSON.parse(localStorage.getItem('sb_j')||'[]'); document.getElementById('jlist').innerHTML = arr.length? arr.map((x,i)=>`<div>${i+1}. ${x}</div>`).join('') : 'ยังไม่มีบันทึก';
}
renderTabs(); show();
</script></body></html>
